<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ARSW Collaborative Board</title>
    <link rel="stylesheet" href="css/app.css">
    <script src="/webjars/stomp-websocket/2.3.4/stomp.min.js"></script>
</head>
<body>
<header>
    <h1>ARSW Collaborative Architecture Board</h1>
</header>

<section class="board-bar">
    <label for="boardName">Name</label>
    <input id="boardName" type="text" placeholder="Board name" value="Architecture Board">
    <button id="newBoardBtn" type="button">New</button>

    <label for="boardId">Board id</label>
    <input id="boardId" type="text" placeholder="boardId">
    <button id="loadBtn" type="button">Load</button>

    <button id="saveBtn" type="button">Save</button>
    <button id="retryBtn" type="button" hidden>Retry</button>
</section>

<section class="live-bar">
    <button id="connectLiveBtn" type="button" disabled>Connect live</button>
    <button id="disconnectLiveBtn" type="button" disabled>Disconnect</button>
    <span>LIVE: <strong id="liveStatus" data-status="disconnected" aria-live="polite">disconnected</strong></span>
    <span>Actor: <code id="actorId"></code></span>
</section>

<section class="toolbar">
    <button id="addRectBtn" type="button">+ Rectangle</button>
    <button id="addTextBtn" type="button">+ Text</button>
    <button id="connectBtn" type="button">Connect selected + next</button>
    <button id="deleteBtn" type="button">Delete selected</button>
</section>

<div id="message" role="status"></div>

<main>
    <svg id="boardCanvas" viewBox="0 0 1000 600"></svg>
</main>

<script type="module" src="js/app.js"></script>
</body>
</html>
